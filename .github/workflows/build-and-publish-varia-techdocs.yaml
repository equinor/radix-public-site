name: Build TechDocs

on:
  push:
    branches:
      - main
      - docs/backstage-add-mkdocs
      - varia-makefile
  workflow_dispatch:

permissions: {}
jobs:
  techdocs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

      - name: Install techdocs-cli
        run: |
          npm install -g @techdocs/cli
          echo "-----------------------------"
          techdocs-cli -V          

      - name: Generate docs site
        run: uv run techdocs-cli generate --no-docker

      - name: "Az login"
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: 1fee4604-0e5f-4b2a-9481-e466bbec1cea
          tenant-id: 3aa4a235-b6e2-48d5-9195-7fcf05b459b0
          allow-no-subscriptions: true

      - name: Publish to blob storage
        env:
          STORAGE_ACCOUNT_NAME: variatdstprod
          BACKSTAGE_ENTITY_KIND: system
          BACKSTAGE_ENTITY_NAME: radix
        run: |
          az storage blob upload-batch \
            --account-name ${STORAGE_ACCOUNT_NAME} \
            --auth-mode login \
            --source site \
            --destination techdocs/default/${BACKSTAGE_ENTITY_KIND}/${BACKSTAGE_ENTITY_NAME} \
            --overwrite true
